<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ════════════════════════════════════════════════════════════════
         SEO / COMPARTIR — Personaliza estos valores junto con
         src/config/wedding.ts antes de publicar.
         ════════════════════════════════════════════════════════════════ -->
    <title>Valentina &amp; Sebastián — ¡Nos casamos!</title>
    <meta
      name="description"
      content="Acompáñanos a celebrar nuestro matrimonio. Sábado 5 de diciembre de 2026 — Confirma tu asistencia."
    />
    <meta name="theme-color" content="#F8F5EF" />

    <!-- URL canónica: reemplaza por el dominio real al desplegar.
         IMPORTANTE: si tu dominio es https://dominio.com, usa también esa
         URL absoluta en og:url y og:image (WhatsApp requiere URL absoluta). -->
    <link rel="canonical" href="https://www.tu-dominio.com/" />
    <meta property="og:url" content="https://www.tu-dominio.com/" />

    <!-- Open Graph / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valentina &amp; Sebastián" />
    <meta property="og:title" content="Alejandro &amp; Margot — ¡Nos casamos!" />
    <meta
      property="og:description"
      content="Acompáñanos a celebrar nuestro matrimonio. Sábado 5 de diciembre de 2026 — Confirma tu asistencia."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Invitación de matrimonio de Alejandro y Margot" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Tipografías: precarga optimizada -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
