<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ════════════════════════════════════════════════════════════════
         SEO / COMPARTIR — Personaliza estos valores junto con
         src/config/wedding.ts antes de publicar.
         ════════════════════════════════════════════════════════════════ -->
    <title>Margot &amp; Alejandro — ¡Nos casamos!</title>
    <meta
      name="description"
      content="Acompáñanos a celebrar nuestro matrimonio. Sábado 21 de noviembre de 2026 · La Paz, Bolivia — Confirma tu asistencia."
    />
    <meta name="theme-color" content="#00224C" />

    <!-- URL canónica: reemplaza por el dominio real al desplegar.
         IMPORTANTE: si tu dominio es https://dominio.com, usa también esa
         URL absoluta en og:url y og:image (WhatsApp requiere URL absoluta). -->
    <link rel="canonical" href="https://www.tu-dominio.com/" />
    <meta property="og:url" content="https://www.tu-dominio.com/" />

    <!-- Open Graph / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Margot &amp; Alejandro" />
    <meta property="og:title" content="Margot &amp; Alejandro — ¡Nos casamos!" />
    <meta
      property="og:description"
      content="Acompáñanos a celebrar nuestro matrimonio. Sábado 21 de noviembre de 2026 · La Paz, Bolivia — Confirma tu asistencia."
    />
    <meta property="og:image" content="/images/15.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Margot y Alejandro abrazados frente a la laguna, bajo un cielo azul" />
    <meta property="og:locale" content="es_BO" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Tipografías del diseño: caligrafía, display festivo y serif clásica
         (precarga optimizada vía Google Fonts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=The+Nautigal:wght@400;700&family=Ms+Madi&family=Playfair+Display:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=Quattrocento:wght@400;700&family=Alice&family=Cardo:ital,wght@0,400;1,400&family=Parisienne&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
